<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>定期テスト対策</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --main: #4f46e5;
      --main-dark: #3730a3;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --border: #e5e7eb;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 30px auto 60px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .section-subtitle {
      color: var(--sub);
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .option-button {
      border: 2px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 12px;
      padding: 14px 10px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.15s;
    }

    .option-button:hover {
      border-color: var(--main);
      transform: translateY(-1px);
    }

    .option-button.selected {
      border-color: var(--main);
      background: #eef2ff;
      color: var(--main-dark);
    }

    .unit-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .unit-button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
    }

    .unit-button:hover {
      border-color: var(--main);
    }

    .unit-button.selected {
      background: #eef2ff;
      border-color: var(--main);
      color: var(--main-dark);
      font-weight: 700;
    }

    .unit-button .unit-name {
      display: block;
      font-size: 14px;
    }

    .unit-button .unit-count {
      display: block;
      color: var(--sub);
      font-size: 12px;
      margin-top: 4px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .select-box {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }

    .start-button {
      width: 100%;
      border: 0;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 17px;
      border-radius: 13px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
    }

    .start-button:hover {
      transform: translateY(-1px);
    }

    .start-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .info {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
    }

    /* Quiz */

    #quizScreen,
    #resultScreen {
      display: none;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .progress-text {
      font-weight: 700;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-value {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      transition: width 0.25s;
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-block;
      background: #eef2ff;
      color: var(--main-dark);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .difficulty-basic {
      background: #ecfdf5;
      color: #047857;
    }

    .difficulty-standard {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .difficulty-advanced {
      background: #fff7ed;
      color: #c2410c;
    }

    .question-text {
      font-size: 23px;
      line-height: 1.65;
      font-weight: 800;
      margin: 20px 0 25px;
      white-space: pre-wrap;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      text-align: left;
      background: white;
      border: 2px solid var(--border);
      border-radius: 13px;
      padding: 16px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1.5;
      transition: 0.15s;
    }

    .choice:hover:not(:disabled) {
      border-color: var(--main);
      background: #fafaff;
    }

    .choice.correct {
      border-color: var(--green);
      background: #f0fdf4;
      color: #166534;
    }

    .choice.incorrect {
      border-color: var(--red);
      background: #fef2f2;
      color: #991b1b;
    }

    .choice:disabled {
      cursor: default;
    }

    .answer-box {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 13px;
      line-height: 1.7;
    }

    .answer-box.correct {
      background: #f0fdf4;
      border: 1px solid #86efac;
    }

    .answer-box.incorrect {
      background: #fef2f2;
      border: 1px solid #fca5a5;
    }

    .answer-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .explanation {
      color: #374151;
      white-space: pre-wrap;
    }

    .next-button {
      display: none;
      width: 100%;
      border: 0;
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Result */

    .result-score {
      text-align: center;
      padding: 20px 0;
    }

    .score-number {
      font-size: 60px;
      font-weight: 900;
      color: var(--main);
    }

    .score-label {
      color: var(--sub);
      margin-top: -5px;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 25px 0;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 900;
    }

    .stat-label {
      color: var(--sub);
      font-size: 12px;
      margin-top: 3px;
    }

    .result-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .secondary-button {
      border: 2px solid var(--border);
      background: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-button:hover {
      border-color: var(--main);
      color: var(--main);
    }

    .review-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .review-item {
      border: 1px solid #fecaca;
      background: #fffafa;
      border-radius: 13px;
      padding: 17px;
      margin-bottom: 12px;
    }

    .review-question {
      font-weight: 800;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .review-answer {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .no-wrong {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
      border-radius: 13px;
      padding: 18px;
      text-align: center;
      font-weight: 700;
    }

    .empty {
      color: var(--sub);
      padding: 15px;
      text-align: center;
    }

    .footer {
      text-align: center;
      color: var(--sub);
      font-size: 12px;
      padding: 25px 0;
    }

    @media (max-width: 800px) {
      .subject-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: 22px 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      .container {
        width: min(100% - 18px, 1100px);
        margin-top: 15px;
      }

      .card {
        padding: 17px;
        border-radius: 14px;
      }

      .button-grid {
        grid-template-columns: 1fr;
      }

      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .unit-container {
        grid-template-columns: 1fr;
        max-height: 360px;
      }

      .question-text {
        font-size: 19px;
      }

      .choice {
        font-size: 15px;
        padding: 14px;
      }

      .result-stats {
        grid-template-columns: 1fr;
      }

      .result-buttons {
        grid-template-columns: 1fr;
      }

      .quiz-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>📚 定期テスト対策</h1>
    <p>中学生の定期テスト対策を4択問題で！</p>
  </header>

  <main class="container">

    <!-- =========================
         設定画面
    ========================== -->

    <section id="setupScreen">

      <div class="card">
        <h2 class="section-title">① 学年を選択</h2>

        <div class="button-grid">
          <button class="option-button" data-grade="1">
            中学1年
          </button>

          <button class="option-button" data-grade="2">
            中学2年
          </button>

          <button class="option-button" data-grade="3">
            中学3年
          </button>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">② 教科を選択</h2>

        <div class="subject-grid">
          <button class="option-button" data-subject="国語">
            国語
          </button>

          <button class="option-button" data-subject="社会">
            社会
          </button>

          <button class="option-button" data-subject="数学">
            数学
          </button>

          <button class="option-button" data-subject="理科">
            理科
          </button>

          <button class="option-button" data-subject="英語">
            英語
          </button>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">③ 単元を選択</h2>

        <p class="section-subtitle">
          複数の単元を選択できます。「すべて選択」も可能です。
        </p>

        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <button
            id="selectAllUnits"
            class="secondary-button"
            type="button"
          >
            すべて選択
          </button>

          <button
            id="clearUnits"
            class="secondary-button"
            type="button"
          >
            選択解除
          </button>
        </div>

        <div id="unitContainer" class="unit-container">
          <div class="empty">
            先に学年と教科を選択してください。
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">④ 問題設定</h2>

        <div class="settings-grid">

          <div>
            <label for="questionCount">
              <strong>問題数</strong>
            </label>

            <select id="questionCount" class="select-box">
              <option value="5">5問</option>
              <option value="10">10問</option>
              <option value="20">20問</option>
              <option value="30">30問</option>
              <option value="50">50問</option>
            </select>
          </div>

          <div>
            <label for="difficulty">
              <strong>難易度</strong>
            </label>

            <select id="difficulty" class="select-box">
              <option value="すべて">すべて</option>
              <option value="基礎">基礎</option>
              <option value="標準">標準</option>
              <option value="応用">応用</option>
            </select>
          </div>

        </div>
      </div>

      <div class="card">

        <div class="info">
          <strong>💡 このサイトについて</strong><br>
          ・問題は4択形式です。<br>
          ・回答するとすぐに正解・不正解と解説が表示されます。<br>
          ・最後に得点、正答率、間違えた問題を確認できます。<br>
          ・問題はランダムに出題されます。<br>
          ・同じ条件で何度でも挑戦できます。
        </div>

        <br>

        <button id="startButton" class="start-button">
          テストを開始する
        </button>

      </div>

    </section>


    <!-- =========================
         クイズ画面
    ========================== -->

    <section id="quizScreen">

      <div class="card">

        <div class="quiz-header">

          <div>
            <div id="progressText" class="progress-text">
              1 / 10
            </div>

            <div class="progress-bar">
              <div id="progressValue" class="progress-value"></div>
            </div>
          </div>

          <button
            id="quitButton"
            class="secondary-button"
            type="button"
          >
            終了
          </button>

        </div>

        <div id="questionMeta" class="question-meta"></div>

        <div id="questionText" class="question-text"></div>

        <div id="choices" class="choices"></div>

        <div id="answerBox" class="answer-box">

          <div id="answerTitle" class="answer-title"></div>

          <div id="explanation" class="explanation"></div>

        </div>

        <button
          id="nextButton"
          class="next-button"
          type="button"
        >
          次の問題へ
        </button>

      </div>

    </section>


    <!-- =========================
         結果画面
    ========================== -->

    <section id="resultScreen">

      <div class="card">

        <div class="result-score">

          <div id="scoreNumber" class="score-number">
            0点
          </div>

          <div class="score-label">
            テスト結果
          </div>

        </div>

        <div class="result-stats">

          <div class="stat">
            <div id="correctCount" class="stat-value">
              0
            </div>

            <div class="stat-label">
              正解
            </div>
          </div>

          <div class="stat">
            <div id="wrongCount" class="stat-value">
              0
            </div>

            <div class="stat-label">
              不正解
            </div>
          </div>

          <div class="stat">
            <div id="accuracy" class="stat-value">
              0%
            </div>

            <div class="stat-label">
              正答率
            </div>
          </div>

        </div>

        <div class="result-buttons">

          <button
            id="retryButton"
            class="start-button"
            type="button"
          >
            もう一度挑戦
          </button>

          <button
            id="homeButton"
            class="secondary-button"
            type="button"
          >
            設定画面に戻る
          </button>

        </div>

      </div>


      <div class="card">

        <div class="review-title">
          ❌ 間違えた問題
        </div>

        <div id="reviewContainer"></div>

      </div>

    </section>

    <div class="footer">
      定期テスト対策サイト
    </div>

  </main>


  <!--
    ==========================================
    問題データ
    questions.js から読み込みます
    ==========================================
  -->

  <script src="questions.js"></script>

  <script>

    /* ========================================
       状態
    ======================================== */

    let selectedGrade = null;
    let selectedSubject = null;
    let selectedUnits = [];

    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let correctAnswers = 0;
    let wrongQuestions = [];
    let answered = false;


    /* ========================================
       HTML要素
    ======================================== */

    const setupScreen =
      document.getElementById("setupScreen");

    const quizScreen =
      document.getElementById("quizScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const unitContainer =
      document.getElementById("unitContainer");

    const startButton =
      document.getElementById("startButton");

    const questionCount =
      document.getElementById("questionCount");

    const difficulty =
      document.getElementById("difficulty");

    const progressText =
      document.getElementById("progressText");

    const progressValue =
      document.getElementById("progressValue");

    const questionMeta =
      document.getElementById("questionMeta");

    const questionText =
      document.getElementById("questionText");

    const choices =
      document.getElementById("choices");

    const answerBox =
      document.getElementById("answerBox");

    const answerTitle =
      document.getElementById("answerTitle");

    const explanation =
      document.getElementById("explanation");

    const nextButton =
      document.getElementById("nextButton");

    const scoreNumber =
      document.getElementById("scoreNumber");

    const correctCount =
      document.getElementById("correctCount");

    const wrongCount =
      document.getElementById("wrongCount");

    const accuracy =
      document.getElementById("accuracy");

    const reviewContainer =
      document.getElementById("reviewContainer");


    /* ========================================
       共通関数
    ======================================== */

    function shuffle(array) {

      const copied = [...array];

      for (
        let i = copied.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [
          copied[i],
          copied[j]
        ] =
        [
          copied[j],
          copied[i]
        ];
      }

      return copied;
    }


    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* ========================================
       学年選択
    ======================================== */

    document
      .querySelectorAll("[data-grade]")
      .forEach(button => {

        button.addEventListener("click", () => {

          document
            .querySelectorAll("[data-grade]")
            .forEach(b =>
              b.classList.remove("selected")
            );

          button.classList.add("selected");

          selectedGrade =
            Number(button.dataset.grade);

          selectedUnits = [];

          updateUnitList();

        });

      });


    /* ========================================
       教科選択
    ======================================== */

    document
      .querySelectorAll("[data-subject]")
      .forEach(button => {

        button.addEventListener("click", () => {

          document
            .querySelectorAll("[data-subject]")
            .forEach(b =>
              b.classList.remove("selected")
            );

          button.classList.add("selected");

          selectedSubject =
            button.dataset.subject;

          selectedUnits = [];

          updateUnitList();

        });

      });


    /* ========================================
       単元一覧
    ======================================== */

    function getAvailableUnits() {

      if (
        !selectedGrade ||
        !selectedSubject
      ) {
        return [];
      }

      const units = questionData
        .filter(q =>
          Number(q.grade) === Number(selectedGrade) &&
          q.subject === selectedSubject
        )
        .map(q => q.unit);

      return [...new Set(units)];
    }


    function getUnitQuestionCount(unit) {

      return questionData.filter(q =>
        Number(q.grade) === Number(selectedGrade) &&
        q.subject === selectedSubject &&
        q.unit === unit
      ).length;

    }


    function updateUnitList() {

      unitContainer.innerHTML = "";

      const units =
        getAvailableUnits();

      if (units.length === 0) {

        unitContainer.innerHTML = `
          <div class="empty">
            この学年・教科の問題データがありません。
          </div>
        `;

        updateStartButton();

        return;
      }


      units.forEach(unit => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "unit-button";

        if (
          selectedUnits.includes(unit)
        ) {
          button.classList.add("selected");
        }

        button.innerHTML = `
          <span class="unit-name">
            ${escapeHTML(unit)}
          </span>

          <span class="unit-count">
            ${getUnitQuestionCount(unit)}問
          </span>
        `;


        button.addEventListener(
          "click",
          () => {

            if (
              selectedUnits.includes(unit)
            ) {

              selectedUnits =
                selectedUnits.filter(
                  item => item !== unit
                );

              button.classList.remove(
                "selected"
              );

            } else {

              selectedUnits.push(unit);

              button.classList.add(
                "selected"
              );

            }

            updateStartButton();

          }
        );


        unitContainer.appendChild(button);

      });

      updateStartButton();

    }


    /* ========================================
       全単元選択
    ======================================== */

    document
      .getElementById("selectAllUnits")
      .addEventListener("click", () => {

        selectedUnits =
          getAvailableUnits();

        updateUnitList();

      });


    /* ========================================
       単元選択解除
    ======================================== */

    document
      .getElementById("clearUnits")
      .addEventListener("click", () => {

        selectedUnits = [];

        updateUnitList();

      });


    /* ========================================
       開始ボタン状態
    ======================================== */

    function updateStartButton() {

      const canStart =
        selectedGrade &&
        selectedSubject &&
        selectedUnits.length > 0 &&
        questionData.length > 0;

      startButton.disabled =
        !canStart;

    }


    /* ========================================
       テスト開始
    ======================================== */

    startButton.addEventListener(
      "click",
      startQuiz
    );


    function startQuiz() {

      let pool =
        questionData.filter(q =>

          Number(q.grade) ===
            Number(selectedGrade) &&

          q.subject ===
            selectedSubject &&

          selectedUnits.includes(q.unit)

        );


      const selectedDifficulty =
        difficulty.value;


      if (
        selectedDifficulty !== "すべて"
      ) {

        pool =
          pool.filter(q =>
            q.difficulty ===
            selectedDifficulty
          );

      }


      if (pool.length === 0) {

        alert(
          "選択した条件に合う問題がありません。\n難易度を「すべて」にして試してください。"
        );

        return;
      }


      const requestedCount =
        Number(questionCount.value);


      /*
       * 問題数より問題データが少ない場合は、
       * 同じ問題を重複させて指定数まで出題。
       */

      quizQuestions = [];

      const shuffledPool =
        shuffle(pool);


      for (
        let i = 0;
        i < requestedCount;
        i++
      ) {

        quizQuestions.push(
          shuffledPool[
            i % shuffledPool.length
          ]
        );

      }


      quizQuestions =
        shuffle(quizQuestions);


      currentQuestionIndex = 0;
      correctAnswers = 0;
      wrongQuestions = [];
      answered = false;


      setupScreen.style.display =
        "none";

      resultScreen.style.display =
        "none";

      quizScreen.style.display =
        "block";


      showQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ========================================
       問題表示
    ======================================== */

    function showQuestion() {

      answered = false;

      const question =
        quizQuestions[
          currentQuestionIndex
        ];


      const current =
        currentQuestionIndex + 1;

      const total =
        quizQuestions.length;


      progressText.textContent =
        `${current} / ${total}`;

      progressValue.style.width =
        `${(current / total) * 100}%`;


      questionMeta.innerHTML = `
        <span class="tag">
          中学${question.grade}年
        </span>

        <span class="tag">
          ${escapeHTML(question.subject)}
        </span>

        <span class="tag">
          ${escapeHTML(question.unit)}
        </span>

        <span class="tag ${
          question.difficulty === "基礎"
            ? "difficulty-basic"
            : question.difficulty === "標準"
              ? "difficulty-standard"
              : "difficulty-advanced"
        }">
          ${escapeHTML(question.difficulty)}
        </span>
      `;


      questionText.textContent =
        question.question;


      choices.innerHTML = "";


      /*
       * 選択肢と正解番号の対応を維持したまま
       * 選択肢をシャッフル。
       */

      const choiceObjects =
        question.choices.map(
          (choice, index) => ({
            text: choice,
            originalIndex: index
          })
        );


      const shuffledChoices =
        shuffle(choiceObjects);


      shuffledChoices.forEach(
        choiceObject => {

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "choice";

          button.textContent =
            choiceObject.text;


          button.addEventListener(
            "click",
            () => {

              answerQuestion(
                choiceObject.originalIndex,
                button
              );

            }
          );


          choices.appendChild(button);

        }
      );


      answerBox.style.display =
        "none";

      answerBox.className =
        "answer-box";

      nextButton.style.display =
        "none";

    }


    /* ========================================
       回答
    ======================================== */

    function answerQuestion(
      selectedIndex,
      selectedButton
    ) {

      if (answered) {
        return;
      }

      answered = true;


      const question =
        quizQuestions[
          currentQuestionIndex
        ];


      const isCorrect =
        selectedIndex ===
        Number(question.answer);


      document
        .querySelectorAll(".choice")
        .forEach(button => {

          button.disabled = true;

        });


      if (isCorrect) {

        correctAnswers++;

        selectedButton.classList.add(
          "correct"
        );

        answerBox.classList.add(
          "correct"
        );

        answerTitle.textContent =
          "⭕ 正解！";

      } else {

        selectedButton.classList.add(
          "incorrect"
        );


        document
          .querySelectorAll(".choice")
          .forEach(button => {

            const text =
              button.textContent;

            if (
              text ===
              question.choices[
                Number(question.answer)
              ]
            ) {

              button.classList.add(
                "correct"
              );

            }

          });


        answerBox.classList.add(
          "incorrect"
        );

        answerTitle.textContent =
          "❌ 不正解";


        wrongQuestions.push({
          ...question
        });

      }


      const correctText =
        question.choices[
          Number(question.answer)
        ];


      explanation.innerHTML = `
        <strong>正解：</strong>
        ${escapeHTML(correctText)}
        <br><br>
        ${escapeHTML(
          question.explanation ||
          "この問題の解説はありません。"
        )}
      `;


      answerBox.style.display =
        "block";


      if (
        currentQuestionIndex <
        quizQuestions.length - 1
      ) {

        nextButton.textContent =
          "次の問題へ";

      } else {

        nextButton.textContent =
          "結果を見る";

      }


      nextButton.style.display =
        "block";

    }


    /* ========================================
       次の問題
    ======================================== */

    nextButton.addEventListener(
      "click",
      () => {

        currentQuestionIndex++;

        if (
          currentQuestionIndex >=
          quizQuestions.length
        ) {

          showResult();

        } else {

          showQuestion();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }

      }
    );


    /* ========================================
       結果表示
    ======================================== */

    function showResult() {

      quizScreen.style.display =
        "none";

      resultScreen.style.display =
        "block";


      const total =
        quizQuestions.length;

      const wrong =
        total - correctAnswers;

      const rate =
        total === 0
          ? 0
          : Math.round(
              (correctAnswers / total) * 100
            );


      const score =
        Math.round(
          (correctAnswers / total) * 100
        );


      scoreNumber.textContent =
        `${score}点`;

      correctCount.textContent =
        correctAnswers;

      wrongCount.textContent =
        wrong;

      accuracy.textContent =
        `${rate}%`;


      showReview();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ========================================
       間違い復習
    ======================================== */

    function showReview() {

      reviewContainer.innerHTML = "";


      if (wrongQuestions.length === 0) {

        reviewContainer.innerHTML = `
          <div class="no-wrong">
            🎉 全問正解です！<br>
            すごいです！
          </div>
        `;

        return;
      }


      wrongQuestions.forEach(
        (question, index) => {

          const item =
            document.createElement("div");

          item.className =
            "review-item";


          const correctText =
            question.choices[
              Number(question.answer)
            ];


          item.innerHTML = `
            <div class="review-question">
              ${index + 1}. 
              ${escapeHTML(question.question)}
            </div>

            <div class="review-answer">
              <strong>正解：</strong>
              ${escapeHTML(correctText)}
              <br><br>

              <strong>解説：</strong><br>
              ${escapeHTML(
                question.explanation ||
                "解説はありません。"
              )}
            </div>
          `;


          reviewContainer.appendChild(item);

        }
      );

    }


    /* ========================================
       もう一度挑戦
    ======================================== */

    document
      .getElementById("retryButton")
      .addEventListener(
        "click",
        () => {

          startQuiz();

        }
      );


    /* ========================================
       ホームへ
    ======================================== */

    document
      .getElementById("homeButton")
      .addEventListener(
        "click",
        () => {

          resultScreen.style.display =
            "none";

          quizScreen.style.display =
            "none";

          setupScreen.style.display =
            "block";

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    /* ========================================
       クイズ終了
    ======================================== */

    document
      .getElementById("quitButton")
      .addEventListener(
        "click",
        () => {

          const confirmed =
            confirm(
              "テストを終了して設定画面に戻りますか？"
            );

          if (!confirmed) {
            return;
          }


          quizScreen.style.display =
            "none";

          resultScreen.style.display =
            "none";

          setupScreen.style.display =
            "block";


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    /* ========================================
       初期状態
    ======================================== */

    if (
      typeof questionData ===
      "undefined"
    ) {

      alert(
        "問題データ（questions.js）が読み込めませんでした。"
      );

    } else {

      updateStartButton();

    }

  </script>

</body>
</html>
