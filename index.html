<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>定期テスト対策</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    button {
      font-family: inherit;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .container {
      width: min(1000px, calc(100% - 30px));
      margin: 25px auto 50px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .selection-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .choice-button {
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice-button:hover {
      border-color: #6366f1;
      transform: translateY(-1px);
    }

    .choice-button.selected {
      background: #6366f1;
      border-color: #6366f1;
      color: white;
      font-weight: bold;
    }

    .unit-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .unit-button {
      text-align: left;
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }

    .unit-button.selected {
      background: #eef2ff;
      border-color: #6366f1;
      color: #4338ca;
      font-weight: bold;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }

    .start-button {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }

    .start-button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none !important;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .progress {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #6366f1;
      transition: width 0.3s;
    }

    .question-number {
      color: #6366f1;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .answer-grid {
      display: grid;
      gap: 12px;
    }

    .answer-button {
      text-align: left;
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .answer-button:hover:not(:disabled) {
      border-color: #6366f1;
      background: #f5f3ff;
    }

    .answer-button:disabled {
      cursor: default;
    }

    .answer-button.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    .answer-button.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .explanation {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
      line-height: 1.7;
    }

    .next-button,
    .home-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .next-button {
      background: #6366f1;
      color: white;
    }

    .home-button {
      background: #e5e7eb;
      color: #222;
    }

    .result-score {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #4f46e5;
      margin: 20px 0;
    }

    .result-message {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .review-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      line-height: 1.7;
    }

    .review-question {
      font-weight: bold;
    }

    .review-answer {
      color: #dc2626;
      margin-top: 5px;
    }

    .review-correct {
      color: #16a34a;
      margin-top: 5px;
    }

    .empty-message {
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      color: #64748b;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f0fdf4;
      color: #166534;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 25px;
      }

      .selection-grid,
      .controls {
        grid-template-columns: 1fr;
      }

      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .unit-list {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      .question-text {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 定期テスト対策</h1>
  <p>中学1年生〜中学3年生対応</p>
</header>

<main class="container">

  <!-- 設定画面 -->
  <section id="setupScreen">

    <div class="card">
      <div class="section-title">① 学年を選択</div>

      <div class="selection-grid">
        <button class="choice-button" data-grade="1">中学1年</button>
        <button class="choice-button" data-grade="2">中学2年</button>
        <button class="choice-button" data-grade="3">中学3年</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">② 教科を選択</div>

      <div class="subject-grid">
        <button class="choice-button" data-subject="国語">国語</button>
        <button class="choice-button" data-subject="社会">社会</button>
        <button class="choice-button" data-subject="数学">数学</button>
        <button class="choice-button" data-subject="理科">理科</button>
        <button class="choice-button" data-subject="英語">英語</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">③ 単元を選択</div>

      <div id="unitList" class="unit-list">
        <div class="empty-message">
          先に学年と教科を選択してください。
        </div>
      </div>

      <div class="info">
        複数の単元を選択できます。
      </div>
    </div>

    <div class="card">

      <div class="section-title">④ 問題数・難易度</div>

      <div class="controls">

        <div>
          <label for="questionCount">問題数</label>

          <select id="questionCount">
            <option value="5">5問</option>
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="30" selected>30問</option>
            <option value="50">50問</option>
          </select>
        </div>

        <div>
          <label for="difficulty">難易度</label>

          <select id="difficulty">
            <option value="すべて">すべて</option>
            <option value="基礎">基礎</option>
            <option value="標準">標準</option>
            <option value="応用">応用</option>
          </select>
        </div>

      </div>

      <button id="startButton" class="start-button">
        ▶ 問題を始める
      </button>

    </div>

  </section>


  <!-- 問題画面 -->
  <section id="quizScreen" class="hidden">

    <div class="card">

      <div class="quiz-header">
        <span id="quizProgressText">1 / 30</span>
        <span id="quizScoreText">正解 0問</span>
      </div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="questionNumber" class="question-number">
        第1問
      </div>

      <div id="questionText" class="question-text">
        問題
      </div>

      <div id="answerGrid" class="answer-grid"></div>

      <div id="explanation" class="explanation hidden"></div>

      <button id="nextButton" class="next-button hidden">
        次の問題へ →
      </button>

    </div>

  </section>


  <!-- 結果画面 -->
  <section id="resultScreen" class="hidden">

    <div class="card">

      <div class="section-title">
        🎉 テスト終了！
      </div>

      <div id="resultScore" class="result-score">
        0 / 0
      </div>

      <div id="resultAccuracy" class="result-message">
        正答率 0%
      </div>

      <div id="resultMessage" class="result-message">
      </div>

      <button id="retryButton" class="next-button">
        🔄 もう一度挑戦する
      </button>

      <button id="homeButton" class="home-button">
        🏠 設定画面に戻る
      </button>

    </div>


    <div class="card">

      <div class="section-title">
        ❌ 間違えた問題
      </div>

      <div id="wrongQuestions">
      </div>

    </div>

  </section>

</main>


<!--
  重要：
  questions.jsを先に読み込みます。
  questions.jsの中で questionData を作ってください。
-->
<script src="questions.js"></script>

<script>

  // =========================
  // 基本設定
  // =========================

  let selectedGrade = null;
  let selectedSubject = null;
  let selectedUnits = [];

  let quizQuestions = [];
  let currentQuestionIndex = 0;
  let correctCount = 0;
  let wrongQuestions = [];


  // =========================
  // HTML要素
  // =========================

  const setupScreen = document.getElementById("setupScreen");
  const quizScreen = document.getElementById("quizScreen");
  const resultScreen = document.getElementById("resultScreen");

  const unitList = document.getElementById("unitList");

  const questionCountSelect =
    document.getElementById("questionCount");

  const difficultySelect =
    document.getElementById("difficulty");

  const startButton =
    document.getElementById("startButton");

  const questionNumber =
    document.getElementById("questionNumber");

  const questionText =
    document.getElementById("questionText");

  const answerGrid =
    document.getElementById("answerGrid");

  const explanation =
    document.getElementById("explanation");

  const nextButton =
    document.getElementById("nextButton");

  const quizProgressText =
    document.getElementById("quizProgressText");

  const quizScoreText =
    document.getElementById("quizScoreText");

  const progressBar =
    document.getElementById("progressBar");

  const resultScore =
    document.getElementById("resultScore");

  const resultAccuracy =
    document.getElementById("resultAccuracy");

  const resultMessage =
    document.getElementById("resultMessage");

  const wrongQuestions =
    document.getElementById("wrongQuestions");

  const retryButton =
    document.getElementById("retryButton");

  const homeButton =
    document.getElementById("homeButton");


  // =========================
  // 問題データ確認
  // =========================

  if (!Array.isArray(window.questionData)) {

    alert(
      "questions.jsから問題データを読み込めませんでした。\n\n" +
      "questions.jsに const questionData = [...] があるか確認してください。"
    );

  }


  // =========================
  // シャッフル
  // =========================

  function shuffle(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

      const j =
        Math.floor(Math.random() * (i + 1));

      [result[i], result[j]] =
        [result[j], result[i]];

    }

    return result;
  }


  // =========================
  // 学年選択
  // =========================

  document
    .querySelectorAll("[data-grade]")
    .forEach(button => {

      button.addEventListener("click", () => {

        document
          .querySelectorAll("[data-grade]")
          .forEach(b =>
            b.classList.remove("selected")
          );

        button.classList.add("selected");

        selectedGrade =
          Number(button.dataset.grade);

        selectedUnits = [];

        updateUnitList();

      });

    });


  // =========================
  // 教科選択
  // =========================

  document
    .querySelectorAll("[data-subject]")
    .forEach(button => {

      button.addEventListener("click", () => {

        document
          .querySelectorAll("[data-subject]")
          .forEach(b =>
            b.classList.remove("selected")
          );

        button.classList.add("selected");

        selectedSubject =
          button.dataset.subject;

        selectedUnits = [];

        updateUnitList();

      });

    });


  // =========================
  // 単元一覧更新
  // =========================

  function updateUnitList() {

    if (
      selectedGrade === null ||
      selectedSubject === null
    ) {

      unitList.innerHTML = `
        <div class="empty-message">
          先に学年と教科を選択してください。
        </div>
      `;

      return;
    }


    const units = [
      ...new Set(

        questionData

          .filter(q =>
            Number(q.grade) === selectedGrade &&
            q.subject === selectedSubject
          )

          .map(q => q.unit)

          .filter(Boolean)

      )
    ];


    if (units.length === 0) {

      unitList.innerHTML = `
        <div class="empty-message">
          この学年・教科にはまだ問題がありません。
        </div>
      `;

      return;
    }


    unitList.innerHTML = "";


    units.forEach(unit => {

      const button =
        document.createElement("button");

      button.className = "unit-button";

      button.textContent = unit;


      button.addEventListener("click", () => {

        if (selectedUnits.includes(unit)) {

          selectedUnits =
            selectedUnits.filter(
              u => u !== unit
            );

          button.classList.remove("selected");

        } else {

          selectedUnits.push(unit);

          button.classList.add("selected");

        }

      });


      unitList.appendChild(button);

    });

  }


  // =========================
  // 問題開始
  // =========================

  startButton.addEventListener("click", startQuiz);


  function startQuiz() {

    if (selectedGrade === null) {

      alert("学年を選択してください。");

      return;
    }


    if (!selectedSubject) {

      alert("教科を選択してください。");

      return;
    }


    if (selectedUnits.length === 0) {

      alert("少なくとも1つの単元を選択してください。");

      return;
    }


    const difficulty =
      difficultySelect.value;


    let pool = questionData.filter(q => {

      const gradeOK =
        Number(q.grade) === selectedGrade;

      const subjectOK =
        q.subject === selectedSubject;

      const unitOK =
        selectedUnits.includes(q.unit);

      const difficultyOK =
        difficulty === "すべて" ||
        q.difficulty === difficulty;

      return (
        gradeOK &&
        subjectOK &&
        unitOK &&
        difficultyOK
      );

    });


    if (pool.length === 0) {

      alert(
        "条件に合う問題がありません。\n" +
        "単元または難易度を変更してください。"
      );

      return;
    }


    const requestedCount =
      Number(questionCountSelect.value);


    /*
      問題数がデータ数より多い場合でも、
      ある程度繰り返して出題できるようにします。
    */

    pool = shuffle(pool);

    quizQuestions = [];


    for (
      let i = 0;
      i < requestedCount;
      i++
    ) {

      quizQuestions.push(
        pool[i % pool.length]
      );

    }


    quizQuestions =
      quizQuestions.map(q => {

        return {
          ...q,
          shuffledChoices:
            shuffle(
              q.choices.map(
                (text, index) => ({
                  text,
                  originalIndex: index
                })
              )
            )
        };

      });


    currentQuestionIndex = 0;
    correctCount = 0;
    wrongQuestions = [];


    setupScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");


    showQuestion();

  }


  // =========================
  // 問題表示
  // =========================

  function showQuestion() {

    const q =
      quizQuestions[currentQuestionIndex];


    const total =
      quizQuestions.length;


    questionNumber.textContent =
      `第${currentQuestionIndex + 1}問`;


    questionText.textContent =
      q.question;


    quizProgressText.textContent =
      `${currentQuestionIndex + 1} / ${total}`;


    quizScoreText.textContent =
      `正解 ${correctCount}問`;


    progressBar.style.width =
      `${((currentQuestionIndex) / total) * 100}%`;


    answerGrid.innerHTML = "";

    explanation.innerHTML = "";

    explanation.classList.add("hidden");

    nextButton.classList.add("hidden");


    q.shuffledChoices.forEach(choice => {

      const button =
        document.createElement("button");

      button.className =
        "answer-button";

      button.textContent =
        choice.text;


      button.addEventListener(
        "click",
        () => answerQuestion(
          choice.originalIndex,
          button
        )
      );


      answerGrid.appendChild(button);

    });

  }


  // =========================
  // 回答
  // =========================

  function answerQuestion(
    selectedAnswer,
    clickedButton
  ) {

    const q =
      quizQuestions[currentQuestionIndex];


    const buttons =
      document.querySelectorAll(
        ".answer-button"
      );


    buttons.forEach(button => {
      button.disabled = true;
    });


    const correctAnswer =
      Number(q.answer);


    buttons.forEach(button => {

      const originalIndex =
        q.shuffledChoices.find(
          c => c.text === button.textContent
        )?.originalIndex;


      if (
        originalIndex === correctAnswer
      ) {

        button.classList.add("correct");

      }

    });


    if (
      selectedAnswer === correctAnswer
    ) {

      clickedButton.classList.add("correct");

      correctCount++;

    } else {

      clickedButton.classList.add("wrong");


      wrongQuestions.push({
        question: q.question,
        yourAnswer:
          q.choices[selectedAnswer],
        correctAnswer:
          q.choices[correctAnswer],
        explanation:
          q.explanation || ""
      });

    }


    quizScoreText.textContent =
      `正解 ${correctCount}問`;


    explanation.innerHTML =
      `<strong>解説</strong><br>${escapeHTML(
        q.explanation || "解説はありません。"
      )}`;


    explanation.classList.remove("hidden");


    nextButton.classList.remove("hidden");


    progressBar.style.width =
      `${((currentQuestionIndex + 1) / quizQuestions.length) * 100}%`;

  }


  // =========================
  // 次の問題
  // =========================

  nextButton.addEventListener(
    "click",
    () => {

      currentQuestionIndex++;


      if (
        currentQuestionIndex >=
        quizQuestions.length
      ) {

        showResult();

      } else {

        showQuestion();

      }

    }
  );


  // =========================
  // 結果表示
  // =========================

  function showResult() {

    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");


    const total =
      quizQuestions.length;


    const accuracy =
      total === 0
        ? 0
        : Math.round(
            (correctCount / total) * 100
          );


    resultScore.textContent =
      `${correctCount} / ${total}`;


    resultAccuracy.textContent =
      `正答率 ${accuracy}%`;


    if (accuracy >= 90) {

      resultMessage.textContent =
        "🌟 とてもよくできました！";

    } else if (accuracy >= 70) {

      resultMessage.textContent =
        "👍 かなりできています！";

    } else if (accuracy >= 50) {

      resultMessage.textContent =
        "📖 もう一度復習してみましょう！";

    } else {

      resultMessage.textContent =
        "💪 間違えた問題を中心に復習しましょう！";

    }


    showWrongQuestions();

  }


  // =========================
  // 間違えた問題
  // =========================

  function showWrongQuestions() {

    wrongQuestions.innerHTML = "";


    if (wrongQuestions.length === 0) {

      wrongQuestions.innerHTML = `
        <div class="info">
          🎉 全問正解です！
        </div>
      `;

      return;
    }


    wrongQuestions.forEach(
      (item, index) => {

        const div =
          document.createElement("div");

        div.className =
          "review-item";


        div.innerHTML = `

          <div class="review-question">
            ${index + 1}. ${escapeHTML(
              item.question
            )}
          </div>

          <div class="review-answer">
            あなたの答え：
            ${escapeHTML(
              item.yourAnswer
            )}
          </div>

          <div class="review-correct">
            正解：
            ${escapeHTML(
              item.correctAnswer
            )}
          </div>

          <div class="explanation">
            ${escapeHTML(
              item.explanation
            )}
          </div>

        `;


        wrongQuestions.appendChild(div);

      }
    );

  }


  // =========================
  // もう一度
  // =========================

  retryButton.addEventListener(
    "click",
    () => {

      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      startQuiz();

    }
  );


  // =========================
  // ホーム
  // =========================

  homeButton.addEventListener(
    "click",
    () => {

      resultScreen.classList.add("hidden");
      quizScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");

    }
  );


  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
